name: Release Standalone App

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  DOTNET_VERSION: 8.0.x
  NODE_VERSION: "20"

jobs:
  publish:
    name: Publish ${{ matrix.label }}
    # Tags do a real release; a manual workflow_dispatch is a dry-run that builds
    # and signs but publishes nothing (the release job stays tag-only).
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            rid: win-x64
            eb_flags: --win --x64
            artifact_name: novalist-windows-x64-installer
            package_name: novalist-windows-x64-setup.exe
          - label: macOS x64
            os: macos-latest
            rid: osx-x64
            eb_flags: --mac --x64
            artifact_name: novalist-macos-x64-dmg
            package_name: novalist-macos-x64.dmg
          - label: macOS ARM64
            os: macos-latest
            rid: osx-arm64
            eb_flags: --mac --arm64
            artifact_name: novalist-macos-arm64-dmg
            package_name: novalist-macos-arm64.dmg
          - label: Linux x64
            os: ubuntu-22.04
            rid: linux-x64
            eb_flags: --linux --x64
            artifact_name: novalist-linux-x64-appimage
            package_name: Novalist-x86_64.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(printf '%s' "$TAG" | grep -oE '[0-9]+(\.[0-9]+)*' | head -n1 || true)"
          if [ -z "$VER" ]; then VER="0.0.1"; fi
          # npm / electron-builder need full semver — pad to three components.
          IFS='.' read -r a b c <<< "$VER"
          VER="${a:-0}.${b:-0}.${c:-0}"
          echo "prefix=$VER" >> "$GITHUB_OUTPUT"

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Set app version
        working-directory: app
        shell: bash
        run: npm version "${{ steps.version.outputs.prefix }}" --no-git-tag-version --allow-same-version

      - name: Publish backend (${{ matrix.rid }})
        working-directory: app
        shell: bash
        run: >-
          dotnet publish ../Novalist.Backend/Novalist.Backend.csproj
          -c Release
          -r "${{ matrix.rid }}"
          --self-contained
          -p:PublishSingleFile=true
          -p:VersionPrefix=${{ steps.version.outputs.prefix }}
          -p:VersionSuffix=
          -o dist-backend

      - name: Build renderer
        working-directory: app
        run: npm run build

      # Export macOS signing + notarization env — ONLY on macOS AND only when the
      # Developer ID secret is actually present. Writing them to $GITHUB_ENV lets
      # us OMIT the variables entirely when unset: an *empty* CSC_LINK makes
      # electron-builder treat "" as a cert file path and crash ("not a file"),
      # whereas an unset one cleanly means "build unsigned". Non-macOS runners
      # never enter this step, so Windows never sees a macOS cert.
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CSC_LINK}" ]; then
            echo "MAC_CSC_LINK not set — building UNSIGNED (skipping signing + notarization)."
            exit 0
          fi
          KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s' "${APPLE_API_KEY_BASE64}" | base64 --decode > "${KEY_PATH}"
          {
            echo "CSC_LINK=${MAC_CSC_LINK}"
            echo "CSC_KEY_PASSWORD=${MAC_CSC_KEY_PASSWORD}"
            echo "APPLE_API_KEY=${KEY_PATH}"
            echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}"
            echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
          } >> "$GITHUB_ENV"
          echo "Developer ID signing + notarization enabled."

      - name: Package (electron-builder)
        working-directory: app
        shell: bash
        # Signing/notarization vars come from $GITHUB_ENV (set by the step above)
        # and only exist on a macOS runner with the Developer ID secret present.
        run: npx electron-builder --config electron-builder.yml ${{ matrix.eb_flags }} -p never

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: app/dist/${{ matrix.package_name }}
          if-no-files-found: error

  # ── Mac App Store build + upload ────────────────────────────────────────
  # Separate job because MAS uses different certificates (Apple Distribution +
  # Mac Installer Distribution), an embedded provisioning profile, the sandbox
  # entitlements, and uploads to App Store Connect instead of a GitHub release.
  # Gated on the MAS secrets being present so the release still works before the
  # App Store side is fully set up. See docs/macos-signing.md.
  mac-app-store:
    name: Mac App Store ${{ matrix.arch }}
    # Dry-run on manual dispatch: builds and signs the .pkg but skips the App
    # Store Connect upload (that step is tag-only), so you can inspect the pkg
    # artifact without consuming a build number.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # App Store: arm64-only for now. The App Store accepts one build per app
        # version, so shipping a single Apple Silicon build avoids the "two builds,
        # submit one" problem. Intel users are still covered natively by the DMG.
        # To go universal later, ship both backends + pick by process.arch and
        # build the Electron app with --universal (see docs/macos-signing.md).
        include:
          - arch: arm64
            rid: osx-arm64
            eb_flags: --mac mas --arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(printf '%s' "$TAG" | grep -oE '[0-9]+(\.[0-9]+)*' | head -n1 || true)"
          if [ -z "$VER" ]; then VER="0.0.1"; fi
          IFS='.' read -r a b c <<< "$VER"
          VER="${a:-0}.${b:-0}.${c:-0}"
          echo "prefix=$VER" >> "$GITHUB_OUTPUT"

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Set app version
        working-directory: app
        shell: bash
        run: npm version "${{ steps.version.outputs.prefix }}" --no-git-tag-version --allow-same-version

      - name: Publish backend (${{ matrix.rid }})
        working-directory: app
        shell: bash
        run: >-
          dotnet publish ../Novalist.Backend/Novalist.Backend.csproj
          -c Release
          -r "${{ matrix.rid }}"
          --self-contained
          -p:PublishSingleFile=true
          -p:VersionPrefix=${{ steps.version.outputs.prefix }}
          -p:VersionSuffix=
          -o dist-backend

      - name: Build renderer
        working-directory: app
        run: npm run build

      - name: Write provisioning profile
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.MAS_PROVISION_PROFILE_BASE64 }}" | base64 --decode > build/embedded.provisionprofile

      - name: Package MAS (electron-builder)
        working-directory: app
        shell: bash
        env:
          # Apple Distribution cert (signs the .app) and Mac Installer
          # Distribution cert (signs the .pkg). electron-builder reads both.
          CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MAS_INSTALLER_CSC_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_INSTALLER_CSC_KEY_PASSWORD }}
        run: npx electron-builder --config electron-builder.yml ${{ matrix.eb_flags }} -p never

      # Diagnostic: show exactly what the mas build produced and where, so a
      # missing/renamed .pkg is obvious in the log.
      - name: List MAS build output
        if: always()
        working-directory: app
        shell: bash
        run: |
          echo "=== .pkg / .app under dist ==="
          find dist -maxdepth 3 \( -name '*.pkg' -o -name '*.app' \) -print 2>/dev/null || true
          echo "=== dist ==="
          ls -la dist 2>/dev/null || true
          echo "=== dist/mas ==="
          ls -la dist/mas 2>/dev/null || true

      - name: Upload to App Store Connect
        # Tag releases only — never upload a build during a manual dry-run.
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: app
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          # altool with an App Store Connect API key expects the .p8 at a known
          # private_keys directory named AuthKey_<KEYID>.p8.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          PKG=$(find dist -maxdepth 3 -name '*.pkg' | head -n1)
          if [ -z "${PKG}" ]; then echo "No .pkg found under dist" >&2; exit 1; fi
          echo "Validating ${PKG}"
          xcrun altool --validate-app -f "${PKG}" -t macos \
            --apiKey "${APPLE_API_KEY_ID}" --apiIssuer "${APPLE_API_ISSUER}"
          echo "Uploading ${PKG}"
          xcrun altool --upload-app -f "${PKG}" -t macos \
            --apiKey "${APPLE_API_KEY_ID}" --apiIssuer "${APPLE_API_ISSUER}"

      - name: Upload MAS pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: novalist-mas-${{ matrix.arch }}-pkg
          path: app/dist/**/*.pkg
          if-no-files-found: error

  # ── iOS TestFlight (App Store Connect) ──────────────────────────────────
  # Builds the MAUI iOS app (Novalist.Mobile) as a signed Release IPA and uploads
  # it to TestFlight. Reuses the Mac App Store's Apple Distribution certificate
  # (the unified "Apple Distribution" cert signs iOS too) and the App Store Connect
  # API key; the only new secret is the iOS App Store provisioning profile. A manual
  # workflow_dispatch is a dry-run: it builds the IPA (and uploads it as an
  # artifact) but skips the App Store Connect upload. See docs/ios-signing.md.
  ios-app-store:
    name: iOS TestFlight
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select newest Xcode
        shell: bash
        run: |
          set -euo pipefail
          # net10.0-ios needs the iOS 26 SDK (Xcode 26). Pick the newest Xcode on
          # the runner; the build fails loudly below if it's too old.
          LATEST=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST/Contents/Developer"; fi
          xcodebuild -version

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore MAUI iOS workload
        run: dotnet workload restore Novalist.Mobile/Novalist.Mobile.csproj

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(printf '%s' "$TAG" | grep -oE '[0-9]+(\.[0-9]+)*' | head -n1 || true)"
          if [ -z "$VER" ]; then VER="0.0.1"; fi
          IFS='.' read -r a b c <<< "$VER"
          echo "prefix=${a:-0}.${b:-0}.${c:-0}" >> "$GITHUB_OUTPUT"
          # Build number must be unique + increasing for TestFlight; the run number
          # satisfies that across re-runs of the same version.
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build mobile web bundle
        working-directory: app
        run: |
          npm ci
          npm run build:mobile

      - name: Import signing certificate
        # Prefer a dedicated iOS distribution cert (IOS_DIST_CSC_LINK) - the one the
        # iOS App Store provisioning profile is tied to - and fall back to the Mac
        # App Store's Apple Distribution cert when the same cert is reused.
        env:
          IOS_CERT_BASE64: ${{ secrets.IOS_DIST_CSC_LINK }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_DIST_CSC_KEY_PASSWORD }}
          MAS_CERT_BASE64: ${{ secrets.MAS_CSC_LINK }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERT_BASE64="${IOS_CERT_BASE64:-$MAS_CERT_BASE64}"
          CERT_PASSWORD="${IOS_CERT_PASSWORD:-$MAS_CERT_PASSWORD}"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "=== identities in build keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -m1 "Apple Distribution" | sed -E 's/^[^"]*"([^"]+)".*$/\1/')
          if [ -z "$IDENTITY" ]; then echo "No Apple Distribution identity imported" >&2; exit 1; fi
          echo "identity=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISION_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/pp.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/pp.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/pp.plist")
          cp "$RUNNER_TEMP/app.mobileprovision" "$DIR/$UUID.mobileprovision"
          echo "profile=$NAME" >> "$GITHUB_ENV"
          echo "Provisioning profile: $NAME ($UUID)"

      - name: Build signed IPA
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish Novalist.Mobile/Novalist.Mobile.csproj \
            -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="$identity" \
            -p:CodesignProvision="$profile" \
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.prefix }} \
            -p:ApplicationVersion=${{ steps.version.outputs.build }}
          IPA=$(find Novalist.Mobile/bin -name "*.ipa" | head -n1)
          if [ -z "$IPA" ]; then echo "No .ipa produced" >&2; exit 1; fi
          echo "ipa=$IPA" >> "$GITHUB_ENV"
          echo "Built $IPA"

      - name: Upload to TestFlight
        # Tag releases only — a manual dispatch is a build-only dry-run.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "Validating $ipa"
          xcrun altool --validate-app -f "$ipa" -t ios \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          echo "Uploading $ipa"
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: novalist-ios-ipa
          path: Novalist.Mobile/bin/**/*.ipa
          if-no-files-found: error

  sdk-and-example:
    name: Pack SDK & Example Extension
    # Tag releases only: this job publishes to NuGet and commits a version bump to
    # the default branch, so it must never run during a manual dry-run.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(printf '%s' "$TAG" | grep -oE '[0-9]+(\.[0-9]+)*' | head -n1 || true)"
          if [ -z "$VER" ]; then VER="0.0.1"; fi
          echo "prefix=$VER" >> "$GITHUB_OUTPUT"

      # ── Download baseline NuGet from NuGet.org ─────────────────────
      - name: Download previous SDK NuGet
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline

          # Query NuGet.org for the latest published version
          INDEX_URL="https://api.nuget.org/v3-flatcontainer/novalist.sdk/index.json"
          VERSIONS_JSON=$(curl -sf "$INDEX_URL" || echo "")

          if [ -z "$VERSIONS_JSON" ]; then
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            echo "Package not yet published on NuGet.org — first release."
            exit 0
          fi

          # Get the latest version (last entry in the versions array)
          PREV_VER=$(echo "$VERSIONS_JSON" | python3 -c "import sys,json; v=json.load(sys.stdin).get('versions',[]); print(v[-1] if v else '')")

          if [ -z "$PREV_VER" ]; then
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            echo "No versions found on NuGet.org."
            exit 0
          fi

          # Download the nupkg directly from NuGet.org flat container
          NUPKG_URL="https://api.nuget.org/v3-flatcontainer/novalist.sdk/${PREV_VER}/novalist.sdk.${PREV_VER}.nupkg"
          curl -sfL "$NUPKG_URL" -o "baseline/Novalist.Sdk.${PREV_VER}.nupkg"

          echo "prev_version=$PREV_VER" >> "$GITHUB_OUTPUT"
          echo "has_baseline=true" >> "$GITHUB_OUTPUT"

          # Extract baseline DLL for comparison
          mkdir -p baseline/extracted
          unzip -q "baseline/Novalist.Sdk.${PREV_VER}.nupkg" -d baseline/extracted
          BASELINE_DLL=$(find baseline/extracted -name 'Novalist.Sdk.dll' | head -1)
          echo "baseline_dll=$BASELINE_DLL" >> "$GITHUB_OUTPUT"
          echo "Previous SDK version from NuGet.org: $PREV_VER"

      # ── Build SDK ─────────────────────────────────────────────────
      - name: Build SDK
        run: dotnet build Novalist.Sdk/Novalist.Sdk.csproj -c Release

      # ── SDK change detection (API comparison) ─────────────────────
      # Only publish a new SDK NuGet when the public API surface changes.
      # Implementation-only changes ship via the host app, not the NuGet.
      - name: Check SDK API changes
        id: sdk_check
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_DLL="Novalist.Sdk/bin/Release/net8.0/Novalist.Sdk.dll"

          if [ "${{ steps.baseline.outputs.has_baseline }}" != "true" ]; then
            echo "sdk_changed=true" >> "$GITHUB_OUTPUT"
            echo "bump_type=patch" >> "$GITHUB_OUTPUT"
            echo "No baseline — treating SDK as changed (first release)."
            exit 0
          fi

          BASELINE_DLL="${{ steps.baseline.outputs.baseline_dll }}"

          # Pass 1: check for breaking changes
          if ! dotnet tool run apicompat -- -l "$BASELINE_DLL" -r "$CURRENT_DLL" --noWarn CP0003 2>&1; then
            echo "sdk_changed=true" >> "$GITHUB_OUTPUT"
            echo "bump_type=major" >> "$GITHUB_OUTPUT"
            echo "BREAKING changes detected → major bump"
            exit 0
          fi

          # Pass 2: check for API additions (strict mode)
          if ! dotnet tool run apicompat -- -l "$BASELINE_DLL" -r "$CURRENT_DLL" --strict-mode --noWarn CP0003 2>&1; then
            echo "sdk_changed=true" >> "$GITHUB_OUTPUT"
            echo "bump_type=minor" >> "$GITHUB_OUTPUT"
            echo "Non-breaking additions detected → minor bump"
            exit 0
          fi

          # API surface identical — no new NuGet needed
          echo "sdk_changed=false" >> "$GITHUB_OUTPUT"
          echo "SDK public API unchanged — skipping NuGet publish."

      # ── Calculate new SDK version ─────────────────────────────────
      - name: Calculate new SDK version
        id: calc_version
        if: steps.sdk_check.outputs.sdk_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.baseline.outputs.has_baseline }}" == "true" ]; then
            PREV="${{ steps.baseline.outputs.prev_version }}"
            BUMP="${{ steps.sdk_check.outputs.bump_type }}"
          else
            # No baseline (first release with this system) — use csproj version
            PREV=$(grep '<VersionPrefix>' Novalist.Sdk/Novalist.Sdk.csproj | sed 's/.*<VersionPrefix>\(.*\)<\/VersionPrefix>.*/\1/')
            # First release: use as-is
            echo "new_sdk_version=$PREV" >> "$GITHUB_OUTPUT"
            echo "First SDK release: $PREV"
            exit 0
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$PREV"
          PATCH=${PATCH:-0}

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VER="${MAJOR}.${MINOR}.${PATCH}"

          # Respect manual override: if csproj version is higher, use it
          CSPROJ_VER=$(grep '<VersionPrefix>' Novalist.Sdk/Novalist.Sdk.csproj | sed 's/.*<VersionPrefix>\(.*\)<\/VersionPrefix>.*/\1/')
          IFS='.' read -r CM Cm Cp <<< "$CSPROJ_VER"
          Cp=${Cp:-0}
          # Compare: csproj > calculated?
          if [ "$CM" -gt "$MAJOR" ] || \
             ([ "$CM" -eq "$MAJOR" ] && [ "$Cm" -gt "$MINOR" ]) || \
             ([ "$CM" -eq "$MAJOR" ] && [ "$Cm" -eq "$MINOR" ] && [ "$Cp" -gt "$PATCH" ]); then
            NEW_VER="$CSPROJ_VER"
            echo "Manual override: csproj version $CSPROJ_VER is higher than calculated $MAJOR.$MINOR.$PATCH"
          fi

          echo "new_sdk_version=$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "SDK version: $PREV → $NEW_VER ($BUMP)"

      # ── Pack SDK NuGet ────────────────────────────────────────────
      - name: Pack SDK NuGet
        if: steps.sdk_check.outputs.sdk_changed == 'true'
        run: >-
          dotnet pack Novalist.Sdk/Novalist.Sdk.csproj
          -c Release
          -p:VersionPrefix=${{ steps.calc_version.outputs.new_sdk_version }}
          -p:VersionSuffix=
          -o artifacts

      # ── Reuse previous SDK NuGet when unchanged ───────────────────
      - name: Reuse previous SDK NuGet
        if: steps.sdk_check.outputs.sdk_changed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PREV_VER="${{ steps.baseline.outputs.prev_version }}"
          cp "baseline/Novalist.Sdk.${PREV_VER}.nupkg" artifacts/
          echo "Reused SDK NuGet $PREV_VER from NuGet.org (no changes detected)"

      # ── Push to NuGet.org ──────────────────────────────────────────
      - name: Push to NuGet.org
        if: steps.sdk_check.outputs.sdk_changed == 'true'
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # ── Update SDK version in csproj ──────────────────────────────
      - name: Update SDK csproj version
        if: steps.sdk_check.outputs.sdk_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          NEW_VER="${{ steps.calc_version.outputs.new_sdk_version }}"
          sed -i "s|<VersionPrefix>.*</VersionPrefix>|<VersionPrefix>${NEW_VER}</VersionPrefix>|" Novalist.Sdk/Novalist.Sdk.csproj
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Novalist.Sdk/Novalist.Sdk.csproj
          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
            git commit -m "chore(sdk): bump SDK version to ${NEW_VER} [skip ci]"
            git push origin HEAD:"${DEFAULT_BRANCH}"
          fi

      # ── Build & package Example Extension ─────────────────────────
      - name: Build Example Extension
        run: >-
          dotnet build Novalist.Sdk.Example/Novalist.Sdk.Example.csproj
          -c Release
          -p:VersionPrefix=${{ steps.version.outputs.prefix }}
          -p:VersionSuffix=

      - name: Zip Example Extension
        shell: bash
        run: |
          set -euo pipefail
          out="Novalist.Sdk.Example/bin/Release/net8.0"
          staging="${GITHUB_WORKSPACE}/ext-staging"
          mkdir -p "${staging}/Themes" "${staging}/Locales"
          cp "${out}/Novalist.Sdk.Example.dll" "${staging}/"
          cp "${out}/Novalist.Sdk.dll" "${staging}/"
          cp "${out}/extension.json" "${staging}/"
          cp "${out}"/Themes/*.axaml "${staging}/Themes/" 2>/dev/null || true
          cp "${out}"/Locales/*.json "${staging}/Locales/" 2>/dev/null || true
          mkdir -p artifacts
          cd "${staging}"
          zip -r "${GITHUB_WORKSPACE}/artifacts/novalist-example-extension.zip" .

      - name: Upload SDK NuGet
        uses: actions/upload-artifact@v4
        with:
          name: novalist-sdk-nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Upload Example Extension zip
        uses: actions/upload-artifact@v4
        with:
          name: novalist-example-extension
          path: artifacts/novalist-example-extension.zip
          if-no-files-found: error

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [publish, sdk-and-example]
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # A tag with a prerelease suffix (e.g. v2.0.0-beta.1) publishes as a
          # prerelease. GitHub's /releases/latest — which the in-app updater uses —
          # excludes prereleases, so tagged test builds never reach users. Plain
          # tags (v2.0.0) publish as a normal, user-facing release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.nupkg
            release-assets/*.zip
