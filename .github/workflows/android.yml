name: Android development APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Novalist.Mobile/**'
      - 'Novalist.Backend/**'
      - 'Novalist.Core/**'
      - 'Novalist.Sdk/**'
      - 'app/**'
      - 'Directory.Build.*'
      - 'eng/Build-Android.ps1'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [android-x64, android-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.303
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Android workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Install renderer dependencies
        working-directory: app
        run: npm ci --no-audit
      - name: Verify renderer
        working-directory: app
        run: |
          npm run test:transport
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          exit $LASTEXITCODE
      - name: Install required Android SDK components
        run: >-
          dotnet build Novalist.Mobile/Novalist.Mobile.csproj -f net10.0-android
          -t:InstallAndroidDependencies -p:AcceptAndroidSdkLicenses=True
          -p:AndroidSdkDirectory="$env:ANDROID_HOME" -p:JavaSdkDirectory="$env:JAVA_HOME"
      - name: Build standalone development APK
        run: ./eng/Build-Android.ps1 -Runtime '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@v4
        with:
          name: novalist-android-development-${{ matrix.runtime }}
          path: Novalist.Mobile/bin/Debug/net10.0-android/${{ matrix.runtime }}/com.novalist.app-Signed.apk
          if-no-files-found: error
