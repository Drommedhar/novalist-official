name: Dependency submission

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    name: NuGet restore (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: desktop
            os: ubuntu-latest
            dotnet: 8.0.x
            project: novalist-official.sln
          - target: ios
            os: macos-latest
            dotnet: 10.0.401
            project: Novalist.Mobile/Novalist.Mobile.csproj

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      # The iOS project is deliberately outside the desktop solution. Restore
      # it on macOS with its workloads, never through an all-csproj Linux scan.
      - name: Install iOS workloads
        if: matrix.target == 'ios'
        run: dotnet workload install maui-ios --version 10.0.401.1

      - name: Restore dependencies
        run: dotnet restore "${{ matrix.project }}"

      - name: Upload resolved dependencies
        uses: actions/upload-artifact@v4
        with:
          name: nuget-assets-${{ matrix.target }}
          path: '**/obj/project.assets.json'
          if-no-files-found: error
          retention-days: 1

  submit:
    name: NuGet dependencies (${{ matrix.target }})
    needs: restore
    # Component Detection's action downloads a Linux executable on non-Windows
    # hosts. Restore iOS on macOS, then scan its resolved assets on Linux.
    runs-on: ubuntu-latest
    # Fork PRs still validate both restores, but cannot write snapshots.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: desktop
            scan: .
            exclude: Novalist.Mobile
          - target: ios
            scan: Novalist.Mobile
            exclude: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nuget-assets-${{ matrix.target }}

      - name: Submit NuGet dependency snapshot
        uses: advanced-security/component-detection-dependency-submission-action@ce792dce44c6e59487bcd862f3917f2c2b9a7fb0
        with:
          detectorsCategories: NuGet
          filePath: ${{ matrix.scan }}
          directoryExclusionList: ${{ matrix.exclude }}
          correlator: nuget-${{ matrix.target }}
