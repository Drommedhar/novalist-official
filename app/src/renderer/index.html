<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' novalist-ext:; style-src 'self' 'unsafe-inline'; img-src 'self' data: novalist-project:; media-src 'self' data: novalist-audio:; connect-src 'self' novalist-audio:; frame-src 'self' novalist-asset: novalist-ext:"

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
