<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- The CI typefaces. This page sits outside the bundler's module graph, so it
     links the vendored sheet directly; without it the host's chosen prose face
     would not resolve inside the frame. -->
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root {
    color-scheme: dark;
    /* Identity defaults, used for the frame's first paint only - setTheme
       replaces them with the live host tokens as soon as the bridge is up. */
    --bg: var(--nl-surface-editor);
    --fg: var(--nl-text);
    --caret: var(--nl-text);
    --selection-bg: var(--nl-surface-selected);
    --accent: var(--nl-accent);
    --subtle: var(--nl-text-subtle);
    --divider: var(--nl-border);
    --font-family: var(--nl-font-family);
    --font-size: var(--nl-font-body);
    --book-width: none;
    --first-line-indent: 0em;
    /* Scrollbar colours mirror the host's --nl-scrollbar-* tokens; setTheme
       overwrites them whenever the app theme changes. */
    --scrollbar-size: var(--nl-scrollbar-size);
    --scrollbar-track: transparent;
    --scrollbar-thumb: var(--nl-scrollbar-thumb);
    --scrollbar-thumb-hover: var(--nl-scrollbar-thumb-hover);
    --scrollbar-thumb-active: var(--nl-scrollbar-thumb-active);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-family);
    font-size: var(--font-size);
    overflow: hidden;
}
body { display: flex; justify-content: center; }
#manuscript-wrapper {
    width: 100%;
    max-width: var(--book-width);
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding: var(--nl-space-xl) var(--nl-space-xxl);
}

/* Themed scrollbars for every scroller in this document, matching the host shell. */
::-webkit-scrollbar { width: var(--scrollbar-size); height: var(--scrollbar-size); }
::-webkit-scrollbar-track,
::-webkit-scrollbar-corner { background: var(--scrollbar-track); }
::-webkit-scrollbar-thumb {
    background-color: var(--scrollbar-thumb);
    border: var(--nl-space-hairline) solid transparent;
    background-clip: padding-box;
    border-radius: var(--nl-radius-pill);
}
::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-thumb-hover); }
::-webkit-scrollbar-thumb:active { background-color: var(--scrollbar-thumb-active); }
::-webkit-scrollbar-button { display: none; }
.chapter-section {
    margin-bottom: var(--nl-space-xxl);
}
.chapter-header {
    margin-bottom: var(--nl-space-lg);
    padding-bottom: var(--nl-space-sm);
    border-bottom: var(--nl-rule-width) solid var(--divider);
}
.chapter-act {
    font-size: var(--nl-font-caption);
    font-weight: 700;
    color: var(--accent);
    margin-bottom: var(--nl-space-hairline);
}
.chapter-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.chapter-title {
    font-size: var(--nl-font-title);
    font-weight: 700;
    color: var(--fg);
}
.chapter-status {
    font-size: var(--nl-font-caption);
    font-weight: 600;
    color: var(--subtle);
    background: var(--divider);
    padding: var(--nl-space-tightest) var(--nl-space-sm);
    border-radius: var(--nl-radius-sm);
    cursor: pointer;
    user-select: none;
}
.chapter-status:hover {
    opacity: 0.8;
}
.scene-block {
    margin-bottom: var(--nl-space-lg);
}
.scene-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--nl-space-tightest);
}
.scene-title {
    font-size: var(--nl-font-ui);
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
}
.scene-title:hover {
    text-decoration: underline;
}
.scene-wordcount {
    font-size: var(--nl-font-caption);
    color: var(--subtle);
}
/* ===== Print =====
   Manuscript mode is the whole book in one document, which is exactly what
   printing it should produce. */
@media print {
    html, body { height: auto; overflow: visible; background: var(--nl-focus-ink-light); color: var(--nl-focus-ink-dark); }
    .scene-editor, .chapter-title, .scene-title { color: var(--nl-focus-ink-dark); }
    .scene-wordcount { display: none !important; }
}

.scene-editor {
    outline: none;
    caret-color: var(--caret);
    line-height: var(--line-height, 1.6);
    letter-spacing: var(--letter-spacing, normal);
    word-wrap: break-word;
    overflow-wrap: break-word;
    white-space: pre-wrap;
    padding: var(--nl-space-tightest) 0;
    min-height: 1.6em;
    border-left: var(--nl-space-hairline) solid transparent;
    padding-left: var(--nl-space-sm);
    transition: border-color var(--nl-motion-normal);
}
.scene-editor:focus {
    border-left-color: var(--accent);
}
.scene-editor p,
.scene-editor div { margin: 0; text-indent: var(--first-line-indent); }
.scene-editor .nv-style-heading,
.scene-editor .nv-style-subheading,
.scene-editor .nv-style-blockquote,
.scene-editor .nv-style-poetry,
.scene-editor li,
.scene-editor li p,
.scene-editor li div,
.scene-editor p.nv-image,
.scene-editor div.nv-image,
.scene-editor p[style*="text-align:center"],
.scene-editor p[style*="text-align: center"],
.scene-editor p[style*="text-align:right"],
.scene-editor p[style*="text-align: right"],
.scene-editor div[style*="text-align:center"],
.scene-editor div[style*="text-align: center"],
.scene-editor div[style*="text-align:right"],
.scene-editor div[style*="text-align: right"],
.scene-editor .nv-scene-break { text-indent: 0; }
.scene-editor.book-spacing p { padding-bottom: 0.75em; }
.scene-editor.book-spacing p:empty { padding-bottom: 0; min-height: 1em; }
.scene-editor ::selection { background: var(--selection-bg); }

.manuscript-footer {
    text-align: center;
    padding: var(--nl-space-lg);
    margin-top: var(--nl-space-lg);
    margin-bottom: var(--nl-space-xxl);
    font-size: var(--nl-font-caption);
    color: var(--subtle);
    background: var(--divider);
    border-radius: var(--nl-radius-sm);
}
</style>
<link rel="stylesheet" href="writing-zoom.css">
</head>
<body>
<div id="manuscript-wrapper"><div id="manuscript-content"></div></div>
<script src="purify.min.js"></script>
<script src="scene-html.js"></script>
<script src="writing-zoom.js"></script>
<script src="manuscript-editor.js"></script>
</body>
</html>
