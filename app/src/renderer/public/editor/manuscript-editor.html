<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- The CI typefaces. This page sits outside the bundler's module graph, so it
     links the vendored sheet directly; without it the host's chosen prose face
     would not resolve inside the frame. -->
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root {
    color-scheme: dark;
    /* Identity defaults, used for the frame's first paint only - setTheme
       replaces them with the live host tokens as soon as the bridge is up. */
    --bg: #0F1219;
    --fg: #ECE5D2;
    --caret: #ECE5D2;
    --selection-bg: rgb(210 167 79 / 0.3);
    --accent: #D2A74F;
    --subtle: #756F62;
    --divider: rgb(237 230 211 / 0.1);
    --font-family: 'Newsreader', Georgia, serif;
    --font-size: 17px;
    --first-line-indent: 0em;
    /* Scrollbar colours mirror the host's --nl-scrollbar-* tokens; setTheme
       overwrites them whenever the app theme changes. */
    --scrollbar-size: 10px;
    --scrollbar-track: transparent;
    --scrollbar-thumb: rgb(255 255 255 / 0.16);
    --scrollbar-thumb-hover: rgb(255 255 255 / 0.3);
    --scrollbar-thumb-active: rgb(255 255 255 / 0.42);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-family);
    font-size: var(--font-size);
    overflow: hidden;
}
body { display: flex; justify-content: center; }
#manuscript-wrapper {
    width: 100%;
    max-width: 760px;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 24px 32px;
}

/* Themed scrollbars for every scroller in this document, matching the host shell. */
::-webkit-scrollbar { width: var(--scrollbar-size); height: var(--scrollbar-size); }
::-webkit-scrollbar-track,
::-webkit-scrollbar-corner { background: var(--scrollbar-track); }
::-webkit-scrollbar-thumb {
    background-color: var(--scrollbar-thumb);
    border: 2px solid transparent;
    background-clip: padding-box;
    border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-thumb-hover); }
::-webkit-scrollbar-thumb:active { background-color: var(--scrollbar-thumb-active); }
::-webkit-scrollbar-button { display: none; }
.chapter-section {
    margin-bottom: 32px;
}
.chapter-header {
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--divider);
}
.chapter-act {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 2px;
}
.chapter-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.chapter-title {
    font-size: 28px;
    font-weight: 700;
    color: var(--fg);
}
.chapter-status {
    font-size: 10px;
    font-weight: 600;
    color: var(--subtle);
    background: var(--divider);
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
}
.chapter-status:hover {
    opacity: 0.8;
}
.scene-block {
    margin-bottom: 20px;
}
.scene-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
}
.scene-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
}
.scene-title:hover {
    text-decoration: underline;
}
.scene-wordcount {
    font-size: 11px;
    color: var(--subtle);
}
/* ===== Print =====
   Manuscript mode is the whole book in one document, which is exactly what
   printing it should produce. */
@media print {
    html, body { height: auto; overflow: visible; background: #fff; color: #000; }
    .scene-editor, .chapter-title, .scene-title { color: #000; }
    .scene-wordcount { display: none !important; }
}

.scene-editor {
    outline: none;
    caret-color: var(--caret);
    line-height: var(--line-height, 1.6);
    letter-spacing: var(--letter-spacing, normal);
    word-wrap: break-word;
    overflow-wrap: break-word;
    white-space: pre-wrap;
    padding: 4px 0;
    min-height: 1.6em;
    border-left: 2px solid transparent;
    padding-left: 8px;
    transition: border-color 0.2s;
}
.scene-editor:focus {
    border-left-color: var(--accent);
}
.scene-editor p,
.scene-editor div { margin: 0; text-indent: var(--first-line-indent); }
.scene-editor .nv-style-heading,
.scene-editor .nv-style-subheading,
.scene-editor .nv-style-blockquote,
.scene-editor .nv-style-poetry,
.scene-editor li,
.scene-editor li p,
.scene-editor li div,
.scene-editor p.nv-image,
.scene-editor div.nv-image,
.scene-editor p[style*="text-align:center"],
.scene-editor p[style*="text-align: center"],
.scene-editor p[style*="text-align:right"],
.scene-editor p[style*="text-align: right"],
.scene-editor div[style*="text-align:center"],
.scene-editor div[style*="text-align: center"],
.scene-editor div[style*="text-align:right"],
.scene-editor div[style*="text-align: right"],
.scene-editor .nv-scene-break { text-indent: 0; }
.scene-editor.book-spacing p { padding-bottom: 0.75em; }
.scene-editor.book-spacing p:empty { padding-bottom: 0; min-height: 1em; }
.scene-editor ::selection { background: var(--selection-bg); }

.manuscript-footer {
    text-align: center;
    padding: 16px;
    margin-top: 16px;
    margin-bottom: 32px;
    font-size: 12px;
    color: var(--subtle);
    background: var(--divider);
    border-radius: 6px;
}
</style>
</head>
<body>
<div id="manuscript-wrapper"></div>
<script src="purify.min.js"></script>
<script src="scene-html.js"></script>
<script src="manuscript-editor.js"></script>
</body>
</html>
