<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The CI typefaces. This page sits outside the bundler's module graph, so it
     links the vendored sheet directly, exactly as the manuscript frame does. -->
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root {
    color-scheme: dark;
    /* First-paint defaults only; setTheme replaces them with the live host
       tokens as soon as the bridge is up. */
    --bg: #0F1219;
    --fg: #ECE5D2;
    --accent: #D2A74F;
    --subtle: #756F62;
    --divider: rgb(237 230 211 / 0.1);
    --font-family: 'Newsreader', Georgia, serif;
    --font-size: 17px;
    --line-height: 1.6;
    --letter-spacing: normal;
    --scrollbar-size: 10px;
    --scrollbar-track: transparent;
    --scrollbar-thumb: rgb(255 255 255 / 0.16);
    --scrollbar-thumb-hover: rgb(255 255 255 / 0.3);
    --scrollbar-thumb-active: rgb(255 255 255 / 0.42);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-family);
    font-size: var(--font-size);
    overflow: hidden;
}
body { display: flex; justify-content: center; }
#wrap {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 24px 32px 96px;
}

::-webkit-scrollbar { width: var(--scrollbar-size); height: var(--scrollbar-size); }
::-webkit-scrollbar-track,
::-webkit-scrollbar-corner { background: var(--scrollbar-track); }
::-webkit-scrollbar-thumb {
    background-color: var(--scrollbar-thumb);
    border: 2px solid transparent;
    background-clip: padding-box;
    border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-thumb-hover); }
::-webkit-scrollbar-thumb:active { background-color: var(--scrollbar-thumb-active); }
::-webkit-scrollbar-button { display: none; }

.nl-chapter { margin-bottom: 40px; }
.nl-chapter-head {
    margin-bottom: 18px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--divider);
}
.nl-act {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 3px;
}
.nl-chapter-title { font-size: 27px; font-weight: 700; color: var(--fg); }
.nl-scene { margin-bottom: 26px; }
.nl-scene-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--subtle);
    margin-bottom: 6px;
}
.nl-prose {
    line-height: var(--line-height);
    letter-spacing: var(--letter-spacing);
}
.nl-prose p { margin-bottom: 0.9em; }
.nl-prose p:last-child { margin-bottom: 0; }

/* A spoken line wears its speaker's colour, and the prose stays the prose.
   A tint rather than a block of colour: the writer is reading their own book
   here, and a page of highlighter is unreadable. */
[data-nl-seg] {
    border-radius: 3px;
    cursor: pointer;
    transition: background-color 90ms linear;
}
[data-nl-seg][data-nl-kind="dialogue"] {
    background-color: color-mix(in srgb, var(--tint, var(--accent)) 15%, transparent);
    box-shadow: inset 2px 0 0 0 var(--tint, var(--accent));
    padding-left: 3px;
}
[data-nl-seg]:hover {
    background-color: color-mix(in srgb, var(--tint, var(--fg)) 26%, transparent);
}
/* Spoken, and nobody was worked out. Worth seeing while scrolling, because it
   is one of the two things the writer is here to fix. */
[data-nl-seg][data-nl-unknown="1"] {
    box-shadow: inset 2px 0 0 0 var(--subtle);
    background-image: repeating-linear-gradient(
        135deg, transparent 0 5px, color-mix(in srgb, var(--subtle) 26%, transparent) 5px 10px);
}
[data-nl-seg].nl-selected {
    outline: 1px solid var(--accent);
    outline-offset: 1px;
}
[data-nl-seg].nl-speaking {
    background-color: color-mix(in srgb, var(--accent) 34%, transparent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 34%, transparent);
}
/* Made, and waiting to be played. Faint on purpose: this is the state most of
   the page is in once a reading has been going for a minute, and a page where
   most of the prose is highlighted says nothing at all.
   On the right edge, because the left one is the speaker's colour - a mark
   there would paint over who is talking to say something about a cache. */
[data-nl-seg].nl-ready {
    box-shadow: inset -2px 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent);
}
[data-nl-seg][data-nl-kind="dialogue"].nl-ready {
    box-shadow: inset 2px 0 0 0 var(--tint, var(--accent)),
        inset -2px 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent);
}
/* Being made now - the one line the model is on, not the batch it was asked
   for. Marking the whole batch hatched a dozen sentences of somebody's prose as
   "being made" when eleven of them had not been started, which is a wall of
   stripes that says nothing. The reading is built ahead of where it is being
   played, and seeing where tells a model thinking from a feature that has
   stopped. */
[data-nl-seg].nl-rendering {
    background-color: color-mix(in srgb, var(--accent) 12%, transparent);
    background-image: repeating-linear-gradient(
        135deg, transparent 0 6px,
        color-mix(in srgb, var(--accent) 22%, transparent) 6px 12px);
    background-size: 34px 34px;
    animation: nl-working 900ms linear infinite;
}
@keyframes nl-working { to { background-position: 34px 0; } }
@media (prefers-reduced-motion: reduce) {
    [data-nl-seg].nl-rendering { animation: none; }
}
.nl-empty { color: var(--subtle); font-size: 15px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div id="wrap"></div>
<script src="purify.min.js"></script>
<script src="scene-html.js"></script>
<script src="narration-editor.js"></script>
</body>
</html>
