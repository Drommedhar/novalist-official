<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data:; frame-src 'self' data:; connect-src 'self' data:"
    />
    <!-- MAUI HybridWebView (.NET 10) serves its JS bridge library here but does
         NOT auto-inject it; the page must reference it. This defines
         window.HybridWebView (SendRawMessage / InvokeDotNet). Must load before the
         shim uses it. -->
    <script src="_framework/hybridwebview.js"></script>

    <title>Novalist</title>
    <!-- The CI typefaces, vendored under public/fonts. Same reasoning as the
         desktop entry point: served root, in flight before the renderer boots. -->
    <link rel="stylesheet" href="./fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile/bootstrap.ts"></script>
  </body>
</html>
